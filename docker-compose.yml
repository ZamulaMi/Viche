# Viche — повний локальний стек:
#   docker compose up -d --build
#   фронт: http://localhost:3000 · сигналінг: ws://localhost:8080/ws
#
# Горизонтальне масштабування сигналінгу:
#   docker compose up -d --scale viche-server=4

services:
  viche-server:
    build: ./server
    environment:
      VICHE_ADDR: ":8080"
      VICHE_DSN: postgres://viche:viche@postgres:5432/viche?sslmode=disable
      VICHE_REDIS: redis:6379
      VICHE_CAPTCHA_SECRET: ${VICHE_CAPTCHA_SECRET:-change-me-to-32-bytes!!}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  viche-web:
    image: nginx:alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - viche-server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viche
      POSTGRES_PASSWORD: viche
      POSTGRES_DB: viche
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viche"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn
    command:
      - -n
      - --realm=viche
      - --user=viche:viche-turn-secret
      - --lt-cred-mech
      - --fingerprint
      - --min-port=49152
      - --max-port=65535
      - --no-tls
      - --no-dtls
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
